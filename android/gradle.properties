# Bingoo Connect Android release configuration
# This project updates the existing Google Play listing: com.bingooconnect.app
#
# IMPORTANT:
# Google Play requires every uploaded AAB to have a versionCode greater than
# ALL previous releases. The default below assumes the old release used 1.
# Before the production upload, compare this with Play Console > App bundle explorer.
BINGOO_VERSION_CODE=2
BINGOO_VERSION_NAME=1.1.0

org.gradle.jvmargs=-Xmx1536m
android.useAndroidX=true
