    <!-- SEO Defaults (overridden dynamically per-page) -->
    <title>Bingoo Connect — NFC Business Cards & Digital Profiles</title>
    <meta name="description" content="One tap to share your entire business world. NFC-powered digital profiles for law firms, salons, restaurants, and every professional." />

    <meta name="robots" content="index, follow" />
    <meta name="author" content="Bingoo Connect" />
    <link rel="canonical" href="https://bingooconnect.com" />

    <!-- Open Graph (overridden dynamically per profile page) -->
    <meta property="og:title" content="Bingoo Connect — NFC Business Cards & Digital Profiles" />
    <meta property="og:description" content="One tap to share your entire business world. NFC-powered digital profiles for professionals." />
    <meta property="og:image" content="https://media.base44.com/images/public/692bd9007b93ba81de543346/5bf500988_BingooconnectNFCBRAND.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bingoo Connect" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bingoo Connect — NFC Business Cards & Digital Profiles" />

    <meta name="twitter:image" content="https://media.base44.com/images/public/692bd9007b93ba81de543346/5bf500988_BingooconnectNFCBRAND.png" />

    <!-- Default structured data for homepage -->
    <script type="application/ld+json">

      "@context": "https://schema.org",

      "name": "Bingoo Connect",
      "url": "https://bingooconnect.com",

        "@type": "SearchAction",
        "target": "https://bingooconnect.com/p/{username}",
        "query-input": "required name=username"
