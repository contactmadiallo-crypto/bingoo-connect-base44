<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b2149" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bingoo" />
    <meta name="application-name" content="Bingoo Connect" />
    <meta name="msapplication-TileColor" content="#0b2149" />

    <!-- Dark Mode Flash Prevention — must run before any other scripts -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('bingoo-theme');
          var userSet = localStorage.getItem('bingoo_lang_user_set');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>

    <!-- App Icons / Favicon — official Bingoo Connect brand mark -->
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/692bd9007b93ba81de543346/be18e28ad_image.png" />
    <link rel="icon" href="https://media.base44.com/images/public/692bd9007b93ba81de543346/be18e28ad_image.png" />
    <link rel="shortcut icon" href="https://media.base44.com/images/public/692bd9007b93ba81de543346/be18e28ad_image.png" />
    <link rel="apple-touch-icon" href="https://media.base44.com/images/public/692bd9007b93ba81de543346/be18e28ad_image.png" />

    <!-- Apple Splash Screens -->
    <meta name="apple-touch-startup-image" content="https://media.base44.com/images/public/692bd9007b93ba81de543346/5bf500988_BingooconnectNFCBRAND.png" />

    <!-- SEO Defaults (overridden dynamically per-page) -->
    <title>Bingoo Connect — NFC Business Cards & Digital Profiles</title>
    <meta name="description" content="One tap to share your entire business world. NFC-powered digital profiles for law firms, salons, restaurants, and every professional." />
    <meta name="keywords" content="NFC business card, digital profile, Bingoo Connect, smart card, contactless sharing, digital business card" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Bingoo Connect" />
    <link rel="canonical" href="https://bingooconnect.com" />

    <!-- Open Graph (overridden dynamically per profile page) -->
    <meta property="og:title" content="Bingoo Connect — NFC Business Cards & Digital Profiles" />
    <meta property="og:description" content="One tap to share your entire business world. NFC-powered digital profiles for professionals." />
    <meta property="og:image" content="https://media.base44.com/images/public/692bd9007b93ba81de543346/5bf500988_BingooconnectNFCBRAND.png" />
    <meta property="og:url" content="https://bingooconnect.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bingoo Connect" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bingoo Connect — NFC Business Cards & Digital Profiles" />

    <meta name="twitter:image" content="https://media.base44.com/images/public/692bd9007b93ba81de543346/5bf500988_BingooconnectNFCBRAND.png" />

    <!-- Sitemap reference -->
    <link rel="sitemap" type="application/xml" href="/api/functions/sitemapXml" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Preconnect for performance -->

    <!-- Default structured data for homepage -->

      "@context": "https://schema.org",

    </script>
